name: Build Windows executable

on:
  workflow_dispatch:
    inputs:
      trader_release:
        description: "Build the no-AI Trader release"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable
        shell: pwsh
        run: |
          if ("${{ inputs.trader_release }}" -eq "true") {
            python build.py --trader
          } else {
            python build.py
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.trader_release == true && 'Tradeopss-Windows' || 'TradeopssAI-Windows' }}
          path: dist/*.exe
          if-no-files-found: error