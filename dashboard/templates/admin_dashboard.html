<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TradeOpss</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── NAVBAR ── */
        .modern-nav {
            background: #07091a;
            border: 1px solid #162040;
            border-top: 1px solid #1e3060;
            border-radius: 14px;
            padding: 0 24px;
            height: 68px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 28px rgba(1,3,10,0.8), 0 1px 0 rgba(30,58,138,0.22);
            position: sticky;
            top: 12px;
            z-index: 500;
        }
        .nav-links { display: flex; gap: 4px; align-items: center; }
        .tab-btn {
            color: #7898be; text-decoration: none; font-weight: 600; font-size: 0.78rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 7px 13px; border-radius: 7px; border-bottom: 2px solid transparent;
            background: transparent; letter-spacing: 0.01em;
            display: flex; align-items: center; gap: 6px;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .tab-btn:hover { color: #e8eeff; background: rgba(30,48,96,0.22); }
        .tab-btn.active { color: #fbbf24; border-bottom: 2px solid #fbbf24; font-weight: 600; }
        .nav-btn-key {
            display: flex; align-items: center; justify-content: center;
            padding: 8px 11px; border-radius: 8px;
            border: 1px solid rgba(251,191,36,0.28); background: rgba(251,191,36,0.07);
            text-decoration: none; transition: all 0.18s ease;
        }
        .nav-btn-key i { color: #fbbf24; font-size: 0.9rem; }
        .nav-btn-key:hover { background: rgba(251,191,36,0.14); border-color: rgba(251,191,36,0.5); box-shadow: 0 0 14px rgba(251,191,36,0.18); }
        .nav-btn-logout {
            display: flex; align-items: center; justify-content: center;
            padding: 8px 11px; border-radius: 8px;
            border: 1px solid rgba(239,68,68,0.25); background: rgba(239,68,68,0.07);
            text-decoration: none; transition: all 0.18s ease;
        }
        .nav-btn-logout i { color: #ef4444; font-size: 0.9rem; }
        .nav-btn-logout:hover { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.5); box-shadow: 0 0 14px rgba(239,68,68,0.18); }

        /* ── DARK-BLUE SCROLLBAR (issues table) ── */
        .issues-scroll::-webkit-scrollbar { width: 7px; height: 7px; }
        .issues-scroll::-webkit-scrollbar-track { background: #07091a; border-radius: 4px; }
        .issues-scroll::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 4px; border: 1px solid #0d1848; }
        .issues-scroll::-webkit-scrollbar-thumb:hover { background: #2e50a0; }
        .issues-scroll::-webkit-scrollbar-corner { background: #07091a; }
        .issues-scroll { scrollbar-color: #1e3a8a #07091a; scrollbar-width: thin; }

        /* ── ADMIN CARD ── */
        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 1px solid #1e3060;
            border-radius: var(--radius);
            margin-bottom: 24px;
            padding: 2px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-navy);
        }
        .admin-header {
            background: linear-gradient(90deg, #1e3a8a 0%, #172554 100%);
            border-top: 1px solid #2e50a0;
            border-bottom: 2px solid #0c1848;
            box-shadow: 0 4px 20px rgba(1,3,10,0.85), inset 0 1px 0 rgba(80,120,210,0.18);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-title-group { display: flex; align-items: center; gap: 12px; }
        .admin-name {
            font-size: 1rem; font-weight: 700; color: #fff;
            font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em;
        }

        /* ── BADGES ── */
        .badge {
            padding: 3px 9px; border-radius: 999px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.62rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.09em;
        }
        .badge-admin  { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
        .badge-trader { background: rgba(45,212,191,0.12);  color: #2dd4bf; border: 1px solid rgba(45,212,191,0.28); }

        /* ── TRADER ITEMS ── */
        .trader-list { padding: 16px; }
        .trader-item {
            background: linear-gradient(180deg, #090f1e 0%, #0c1428 100%);
            border: 1px solid #162040;
            border-left: 2px solid #1e3a8a;
            border-top: 1px solid #1e3060;
            border-radius: 10px;
            margin-bottom: 14px;
            transition: all 0.2s ease;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(1,3,10,0.75), 0 1px 0 rgba(30,58,138,0.15);
        }
        .trader-item:hover {
            border-color: #244068; border-left-color: #3558a8;
            box-shadow: 0 8px 28px rgba(1,3,10,0.85), 0 0 0 1px rgba(30,58,138,0.28);
        }
        .trader-header {
            padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(90deg, #065f46 0%, #047857 100%);
            border-top: 1px solid #10a070;
            border-bottom: 1px solid #033d2a;
        }
        .trader-name {
            font-weight: 700; color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.01em; font-size: 0.92rem;
        }

        /* ── CLIENT TAGS ── */
        .client-list { padding: 16px; display: flex; flex-wrap: wrap; gap: 10px; }
        .client-tag-wrapper { display: flex; align-items: stretch; border-radius: 6px; overflow: hidden; }
        .client-tag {
            background: linear-gradient(135deg, #0d1424, #080e1a);
            border: 1px solid #192848;
            border-top: 1px solid #253660;
            border-right: none;
            padding: 6px 12px;
            border-radius: 6px 0 0 6px;
            font-size: 0.82rem;
            display: flex; align-items: center;
            color: #e8c97a; text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 1px 3px rgba(1,3,10,0.4);
            font-weight: 500;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.01em;
        }
        .client-tag:hover {
            background: linear-gradient(135deg, #131e36, #0d1424);
            border-color: #fbbf24; color: #fbbf24;
            box-shadow: 0 4px 16px rgba(3,5,12,0.7), 0 0 0 1px rgba(251,191,36,0.15);
        }
        .client-tag i { color: #fbbf24; margin-right: 8px; font-size: 0.85rem; }
        .client-tag.is-inactive { opacity: 0.55; }
        .client-edit-btn {
            background: rgba(30,58,138,0.15);
            border: 1px solid #192848;
            border-top: 1px solid #253660;
            border-left: 1px solid rgba(255,255,255,0.06);
            border-radius: 0 6px 6px 0;
            padding: 0 9px;
            display: flex; align-items: center;
            cursor: pointer; transition: all 0.15s ease;
            color: var(--text-secondary);
        }
        .client-edit-btn:hover { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .client-edit-btn i { font-size: 0.72rem; }

        /* inline badges inside tags */
        .client-badge-bef {
            background: rgba(234,179,8,0.15); color: #facc15;
            border: 1px solid rgba(234,179,8,0.25); border-radius: 99px;
            font-size: 0.6rem; font-family: 'IBM Plex Mono', monospace;
            font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
            padding: 1px 6px; margin-left: 6px;
        }
        .client-badge-inactive {
            background: rgba(239,68,68,0.18); color: #f87171;
            border: 1px solid rgba(239,68,68,0.28); border-radius: 99px;
            font-size: 0.6rem; font-family: 'IBM Plex Mono', monospace;
            font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
            padding: 1px 6px; margin-left: 4px;
        }

        /* ── STAT BOXES ── */
        .stat-row { display: flex; gap: 16px; margin-bottom: 28px; }
        .stat-box { flex: 1; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid; }
        .stat-box .stat-lbl {
            font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em;
            margin-bottom: 5px; text-transform: uppercase;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .stat-box .stat-val { font-size: 2rem; font-weight: 800; }

        /* ── MODAL ── */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #0d1424; color: var(--text-primary);
            border: 1px solid #192848; border-top: 1px solid #3d5fa0;
            box-shadow: 0 30px 60px -12px rgba(3,5,12,0.9), 0 1px 0 rgba(61,95,160,0.25);
            margin: 8% auto; padding: 32px;
            width: 420px; max-width: 95vw;
            border-radius: var(--radius); position: relative;
        }
        .modal-close {
            position: absolute; right: 20px; top: 20px;
            font-size: 22px; cursor: pointer; color: var(--text-secondary);
            background: none; border: none; transition: color 0.15s ease; line-height: 1;
        }
        .modal-close:hover { color: var(--text-primary); }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-secondary); font-size: 0.85rem; }
        .form-dark {
            background: rgba(1,3,10,0.6); border: 1px solid #162040;
            color: #e8eeff; font-family: 'IBM Plex Mono', monospace;
            font-size: 0.84rem; border-radius: 8px; padding: 10px;
            width: 100%; box-sizing: border-box;
        }
        .form-dark:focus {
            border-color: #2a4a8a; background: rgba(1,3,10,0.85);
            box-shadow: 0 0 0 3px rgba(30,58,138,0.2); outline: none;
        }
        .btn-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #0a0800; font-family: 'Space Grotesk', sans-serif;
            font-weight: 700; border: none; padding: 12px 24px;
            border-radius: 8px; cursor: pointer; width: 100%; font-size: 0.95rem;
            box-shadow: 0 2px 10px rgba(251,191,36,0.3); transition: all 0.18s ease;
        }
        .btn-gold:hover { box-shadow: 0 4px 18px rgba(251,191,36,0.45); transform: translateY(-1px); filter: brightness(1.06); }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            .modern-nav { height: auto; flex-wrap: wrap; padding: 10px 12px; gap: 6px; justify-content: center; margin-bottom: 16px; }
            .modern-nav .brand { position: static !important; transform: none !important; width: 100%; display: flex; justify-content: center; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 4px; }
            .tab-btn { font-size: 0.78rem !important; padding: 6px 9px !important; }
            .stat-row { flex-wrap: wrap; }
        }

        /* ── DARK-BLUE SCROLLBAR (admin issues + summaries lists) ── */
        #admin-owned-issues-list::-webkit-scrollbar,
        #admin-signoff-list::-webkit-scrollbar { width: 7px; height: 7px; }
        #admin-owned-issues-list::-webkit-scrollbar-track,
        #admin-signoff-list::-webkit-scrollbar-track { background: #07091a; border-radius: 6px; }
        #admin-owned-issues-list::-webkit-scrollbar-thumb,
        #admin-signoff-list::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 6px; border: 1px solid #0d1848; }
        #admin-owned-issues-list::-webkit-scrollbar-thumb:hover,
        #admin-signoff-list::-webkit-scrollbar-thumb:hover { background: #2e50a0; }
        #admin-owned-issues-list,
        #admin-signoff-list { scrollbar-color: #1e3a8a #07091a; scrollbar-width: thin; }
    </style>
</head>
<body>
<div class="container">

    <!-- NAVBAR -->
    <nav class="modern-nav">
        <div class="brand" style="position:absolute;left:24px;top:50%;transform:translateY(-50%);z-index:200;">
            <a href="{{ home_url }}" style="display:block;line-height:0;">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="TradeOpss" style="width:100px;height:auto;object-fit:contain;">
            </a>
        </div>
        <div style="position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;gap:8px;align-items:center;">
            <button class="tab-btn" id="admin-issues-tab-btn" onclick="openAdminTab('issues')" style="color:#93c5fd;border-bottom:2px solid #93c5fd;position:relative;">
                <i class="fas fa-circle-exclamation"></i> Issues
                <span id="issues-nav-badge" style="display:none;position:absolute;top:-2px;right:-4px;background:#ef4444;color:#fff;font-size:0.55rem;font-family:'IBM Plex Mono',monospace;font-weight:700;padding:1px 5px;border-radius:99px;line-height:1.4;min-width:18px;text-align:center;"></span>
            </button>
            <button class="tab-btn" id="admin-summaries-tab-btn" onclick="openAdminTab('summaries')" style="color:#7898be;border-bottom:2px solid transparent;position:relative;" title="Daily Summaries">
                <i class="fas fa-paper-plane"></i> Summaries
                <span id="summaries-nav-badge" style="display:none;position:absolute;top:-2px;right:-4px;background:#fbbf24;color:#0b1225;font-size:0.55rem;font-family:'IBM Plex Mono',monospace;font-weight:800;padding:1px 5px;border-radius:99px;line-height:1.4;min-width:18px;text-align:center;"></span>
            </button>
            <a href="/change-password" class="nav-btn-key" title="Change Password"><i class="fas fa-key"></i></a>
            <a href="/logout" class="nav-btn-logout" title="Logout"><i class="fas fa-right-from-bracket"></i></a>
        </div>
    </nav>

    <!-- PAGE HEADING -->
    <div style="margin-bottom:20px;">
        <h1 style="font-size:1.5rem;margin-bottom:4px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-0.02em;">Admin Dashboard</h1>
        <p style="color:var(--text-secondary);margin:0;font-size:0.9rem;">Welcome, <strong style="color:var(--text-primary);">{{ admin_name }}</strong> — manage your traders and client portfolios.</p>
    </div>

    <!-- STAT BOXES -->
    <div class="stat-row">
        <div class="stat-box" style="background:linear-gradient(135deg,rgba(5,150,105,0.15),rgba(4,120,87,0.6));border-color:rgba(5,150,105,0.4);">
            <div class="stat-lbl" style="color:#4ade80;">Traders</div>
            <div class="stat-val" style="color:#4ade80;text-shadow:0 0 20px rgba(74,222,128,0.4);" id="stat-traders">—</div>
        </div>
        <div class="stat-box" style="background:linear-gradient(135deg,rgba(30,58,138,0.15),rgba(23,37,84,0.6));border-color:rgba(30,58,138,0.4);">
            <div class="stat-lbl" style="color:#7baef0;">Clients</div>
            <div class="stat-val" style="color:#93c5fd;text-shadow:0 0 20px rgba(147,197,253,0.3);" id="stat-clients">—</div>
        </div>
        <div class="stat-box" style="background:linear-gradient(135deg,rgba(217,119,6,0.15),rgba(180,83,9,0.6));border-color:rgba(217,119,6,0.4);">
            <div class="stat-lbl" style="color:#fde047;">Active Clients</div>
            <div class="stat-val" style="color:#fbbf24;text-shadow:0 0 20px rgba(251,191,36,0.4);" id="stat-active">—</div>
        </div>
    </div>

    <!-- ADMIN TABS -->
    <div id="admin-issues-panel" style="margin-bottom:24px;">
        <div style="background:#090f1e;border:1px solid #162040;border-top:2px solid rgba(239,68,68,0.55);border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(1,3,10,0.9);">
            <div style="background:linear-gradient(90deg,#1a1a2e 0%,#16213e 100%);border-bottom:1px solid #1e3060;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;">
                <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                    <i class="fas fa-circle-exclamation" style="color:#f87171;font-size:1rem;"></i>
                    <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1rem;color:#e8eeff;">Admin-owned Issues</span>
                    <span id="admin-tracker-badge" style="background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.28);border-radius:12px;font-size:0.7rem;font-family:'IBM Plex Mono',monospace;font-weight:800;padding:2px 10px;white-space:nowrap;"></span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                    <span id="admin-tracker-date" style="font-size:0.75rem;color:#94a3b8;font-family:'IBM Plex Mono',monospace;"></span>
                    <button onclick="loadAdminTracker()" title="Refresh"
                        style="width:auto;background:rgba(59,99,196,0.18);border:1px solid rgba(59,99,196,0.4);color:#93c5fd;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:0.78rem;font-family:'Space Grotesk',sans-serif;font-weight:700;white-space:nowrap;transition:all 0.15s;"
                        onmouseover="this.style.background='rgba(59,99,196,0.32)'" onmouseout="this.style.background='rgba(59,99,196,0.18)'">
                        <i class="fas fa-rotate-right"></i>
                    </button>
                    <button onclick="closeAdminPanels()" title="Close"
                        style="width:auto;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);color:#f87171;padding:6px 10px;border-radius:10px;cursor:pointer;font-size:0.78rem;font-family:'Space Grotesk',sans-serif;font-weight:800;white-space:nowrap;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;"
                        onmouseover="this.style.background='rgba(239,68,68,0.22)';this.style.color='#fca5a5'" onmouseout="this.style.background='rgba(239,68,68,0.12)';this.style.color='#f87171'">
                        <i class="fas fa-xmark"></i><span>Close</span>
                    </button>
                </div>
            </div>
            <div style="padding:12px 18px;">
                <div id="admin-owned-issues-list" style="max-height:520px;overflow:auto;">
                    <div style="text-align:center;color:#64748b;padding:18px 10px;"><i class="fas fa-circle-notch fa-spin" style="color:#fbbf24;"></i> Loading…</div>
                </div>
            </div>
        </div>
    </div>

    <div id="admin-summaries-panel" style="display:none;margin-bottom:24px;">
        <div style="background:#090f1e;border:1px solid #162040;border-top:2px solid rgba(74,222,128,0.55);border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(1,3,10,0.9);">
            <div style="background:linear-gradient(90deg,#1a1a2e 0%,#16213e 100%);border-bottom:1px solid #1e3060;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;">
                <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                    <i class="fas fa-paper-plane" style="color:#4ade80;font-size:1rem;"></i>
                    <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1rem;color:#e8eeff;">Daily Summaries — Sign-off</span>
                    <span id="admin-signoff-badge" style="background:rgba(74,222,128,0.10);color:#4ade80;border:1px solid rgba(74,222,128,0.22);border-radius:12px;font-size:0.7rem;font-family:'IBM Plex Mono',monospace;font-weight:800;padding:2px 10px;white-space:nowrap;"></span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                    <button onclick="loadAdminTracker()" title="Refresh"
                        style="width:auto;background:rgba(59,99,196,0.18);border:1px solid rgba(59,99,196,0.4);color:#93c5fd;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:0.78rem;font-family:'Space Grotesk',sans-serif;font-weight:700;white-space:nowrap;transition:all 0.15s;"
                        onmouseover="this.style.background='rgba(59,99,196,0.32)'" onmouseout="this.style.background='rgba(59,99,196,0.18)'">
                        <i class="fas fa-rotate-right"></i>
                    </button>
                    <button onclick="closeAdminPanels()" title="Close"
                        style="width:auto;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);color:#f87171;padding:6px 10px;border-radius:10px;cursor:pointer;font-size:0.78rem;font-family:'Space Grotesk',sans-serif;font-weight:800;white-space:nowrap;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;"
                        onmouseover="this.style.background='rgba(239,68,68,0.22)';this.style.color='#fca5a5'" onmouseout="this.style.background='rgba(239,68,68,0.12)';this.style.color='#f87171'">
                        <i class="fas fa-xmark"></i><span>Close</span>
                    </button>
                </div>
            </div>
            <div style="padding:12px 18px;">
                <div id="admin-signoff-list" style="max-height:520px;overflow:auto;">
                    <div style="text-align:center;color:#64748b;padding:18px 10px;"><i class="fas fa-circle-notch fa-spin" style="color:#4ade80;"></i> Loading…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTENT -->
    <div id="content">
        <div style="text-align:center;padding:80px;color:var(--text-secondary);">
            <i class="fas fa-circle-notch fa-spin" style="font-size:2rem;color:var(--accent-color);margin-bottom:16px;display:block;"></i>
            <p style="margin:0;">Loading administration panel...</p>
        </div>
    </div>

</div>

<!-- EDIT CLIENT MODAL -->
<div id="editClientModal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
        <h2 style="margin-top:0;margin-bottom:24px;font-family:'Plus Jakarta Sans',sans-serif;font-size:1.1rem;font-weight:700;color:#fff;">Edit Client Profile</h2>
        <form id="editClientForm">
            <input type="hidden" id="editAdmin">
            <input type="hidden" id="editTrader">
            <input type="hidden" id="editName">
            <div class="form-group">
                <label class="form-label">Client Name</label>
                <div id="editNameDisplay" style="padding:10px;background:rgba(255,255,255,0.04);border:1px solid #162040;border-radius:6px;color:var(--text-secondary);font-family:'IBM Plex Mono',monospace;font-size:0.84rem;"></div>
            </div>
            <div class="form-group">
                <label class="form-label">Risk Profile / Category</label>
                <select id="editCategory" class="form-dark">
                    <option value="PRIVATE">Private (Standard)</option>
                    <option value="BEF">BEF (High Risk)</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select id="editActiveStatus" class="form-dark">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            <button type="submit" class="btn-gold"><i class="fas fa-save" style="margin-right:8px;"></i>Save Changes</button>
        </form>
    </div>
</div>

<script>
    const adminName = "{{ admin_name }}";
    let _adminTracker = null;

    fetch('/api/hierarchy')
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('content');
            container.innerHTML = '';

            if (data.status === 'error' || !data.admins || !data.admins[adminName]) {
                container.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger-color);">Admin Access Error</div>`;
                return;
            }

            const adminData = data.admins[adminName];
            const traders = adminData.traders || {};

            if (Object.keys(traders).length === 0) {
                container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-secondary);">No traders assigned to this admin.</div>`;
                return;
            }

            let totalTraders = 0, totalClients = 0, totalActive = 0;

            // Outer admin card
            const adminCard = document.createElement('div');
            adminCard.className = 'admin-card';
            adminCard.innerHTML = `
                <div class="admin-header">
                    <div class="admin-title-group">
                        <div class="admin-name">${adminName}</div>
                        <span class="badge badge-admin">Admin</span>
                    </div>
                    <span style="font-size:0.8rem;color:rgba(255,255,255,0.55);" id="trader-count-label"></span>
                </div>
                <div class="trader-list" id="trader-list-inner"></div>
            `;
            container.appendChild(adminCard);

            const traderListEl = adminCard.querySelector('#trader-list-inner');

            Object.entries(traders).forEach(([traderName, traderData]) => {
                totalTraders++;
                let clients = [];
                if (Array.isArray(traderData)) {
                    clients = traderData;
                } else if (traderData && traderData.clients) {
                    clients = traderData.clients;
                }

                const clientsHTML = clients.map(client => {
                    const cName    = (typeof client === 'object') ? client.name : client;
                    const cProfile = (typeof client === 'object') ? (client.category || 'PRIVATE') : 'PRIVATE';
                    const cActive  = (typeof client === 'object') ? (client.active_status || 'active') : 'active';
                    totalClients++;
                    if (cActive !== 'inactive') totalActive++;
                    const isBEF      = cProfile.toUpperCase() === 'BEF';
                    const isInactive = cActive === 'inactive';
                    return `
                        <div class="client-tag-wrapper">
                            <a href="/dashboard/${encodeURIComponent(cName)}" class="client-tag${isInactive ? ' is-inactive' : ''}">
                                <i class="fas fa-user"></i>${cName}
                                ${isBEF      ? '<span class="client-badge-bef">BEF</span>'   : ''}
                                ${isInactive ? '<span class="client-badge-inactive">Off</span>' : ''}
                            </a>
                            <button class="client-edit-btn" onclick="editClient('${adminName}','${traderName}','${cName}','${cProfile}','${cActive}')" title="Edit client">
                                <i class="fas fa-cog"></i>
                            </button>
                        </div>
                    `;
                }).join('');

                const traderItem = document.createElement('div');
                traderItem.className = 'trader-item';
                traderItem.innerHTML = `
                    <div class="trader-header">
                        <div class="trader-name"><i class="fas fa-user-tie" style="margin-right:8px;opacity:0.85;"></i>${traderName}</div>
                        <span class="badge badge-trader">${clients.length} client${clients.length !== 1 ? 's' : ''}</span>
                    </div>
                    <div class="client-list">
                        ${clients.length > 0 ? clientsHTML : '<span style="color:var(--text-secondary);font-size:0.85rem;font-style:italic;">No clients assigned</span>'}
                    </div>
                `;
                traderListEl.appendChild(traderItem);
            });

            document.getElementById('stat-traders').textContent = totalTraders;
            document.getElementById('stat-clients').textContent = totalClients;
            document.getElementById('stat-active').textContent  = totalActive;
            document.getElementById('trader-count-label').textContent = totalTraders + ' trader' + (totalTraders !== 1 ? 's' : '');
        })
        .catch(err => {
            console.error(err);
            document.getElementById('content').innerHTML = `<div style="text-align:center;color:var(--danger-color);padding:40px;">System Error: Failed to load hierarchy.</div>`;
        });

    // ── ADMIN TRACKER ─────────────────────────────────────────────────────────
    function _esc(s) {
        return String(s ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function _sevColor(sev) {
        const s = (sev || '').toLowerCase();
        if (s === 'critical') return { bg: 'rgba(239,68,68,0.18)', bd: 'rgba(239,68,68,0.45)', fg: '#fca5a5' };
        if (s === 'high')     return { bg: 'rgba(249,115,22,0.14)', bd: 'rgba(249,115,22,0.40)', fg: '#fb923c' };
        if (s === 'medium')   return { bg: 'rgba(251,191,36,0.12)', bd: 'rgba(251,191,36,0.35)', fg: '#fbbf24' };
        if (s === 'low')      return { bg: 'rgba(148,163,184,0.12)', bd: 'rgba(148,163,184,0.25)', fg: '#94a3b8' };
        return { bg: 'rgba(96,165,250,0.10)', bd: 'rgba(96,165,250,0.25)', fg: '#60a5fa' };
    }

    async function loadAdminTracker() {
        const issuesList = document.getElementById('admin-owned-issues-list');
        const signoffList = document.getElementById('admin-signoff-list');
        issuesList.innerHTML = `<div style="text-align:center;color:#64748b;padding:18px 10px;"><i class="fas fa-circle-notch fa-spin" style="color:#fbbf24;"></i> Loading…</div>`;
        signoffList.innerHTML = `<div style="text-align:center;color:#64748b;padding:18px 10px;"><i class="fas fa-circle-notch fa-spin" style="color:#4ade80;"></i> Loading…</div>`;
        try {
            // Always include admin name so super_admin/bef_admin views work too.
            // For real admin sessions, the server ignores the query param and uses session identity.
            // Do NOT send browser date — server runs UTC and the tracker/sign-off is keyed by server date.
            const resp = await fetch('/api/admin/tracker?admin=' + encodeURIComponent(adminName), { credentials: 'same-origin' });
            const data = await resp.json();
            if (!resp.ok || data.status !== 'success') {
                const msg = _esc(data.message || `HTTP ${resp.status}`);
                issuesList.innerHTML = `<div style="color:#f87171;padding:12px;">Failed to load: ${msg}</div>`;
                signoffList.innerHTML = `<div style="color:#f87171;padding:12px;">Failed to load: ${msg}</div>`;
                return;
            }
            _adminTracker = data;
            document.getElementById('admin-tracker-date').textContent = data.date || '';
            const totalIssues = (data.admin_issues || []).length;
            document.getElementById('admin-tracker-badge').textContent = `${totalIssues} issue${totalIssues === 1 ? '' : 's'}`;
            // Nav badge
            const navBadge = document.getElementById('issues-nav-badge');
            if (navBadge) {
                if (totalIssues > 0) { navBadge.textContent = totalIssues; navBadge.style.display = 'inline-block'; }
                else { navBadge.style.display = 'none'; }
            }

            // Render issues
            if (!data.admin_issues || data.admin_issues.length === 0) {
                issuesList.innerHTML = `<div style="text-align:center;color:#4ade80;padding:18px 10px;"><i class="fas fa-circle-check"></i> No admin issues</div>`;
            } else {
                issuesList.innerHTML = data.admin_issues.map(i => {
                    const c = _sevColor(i.severity);
                    const type = (i.type || '').replace(/_/g, ' ');
                    const t = (i.type || '');
                    const useEvalAnchor = (i.row !== undefined && i.row !== null)
                        && t !== 'daily_summary_payout_qa' && t !== 'mff_payout_summary_qa';
                    const link = `/dashboard/${encodeURIComponent(i.client_id)}${useEvalAnchor ? ('#eval-row-' + i.row) : ''}`;
                    return `
                        <div style="display:flex;gap:10px;align-items:flex-start;padding:10px 10px;border:1px solid rgba(22,32,64,0.9);border-radius:10px;background:rgba(2,6,23,0.55);margin-bottom:8px;">
                            <div style="flex:0 0 auto;padding:2px 8px;border-radius:999px;background:${c.bg};border:1px solid ${c.bd};color:${c.fg};font-family:'IBM Plex Mono',monospace;font-size:0.65rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;">${_esc(i.severity)}</div>
                            <div style="min-width:0;flex:1 1 auto;">
                                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                                    <a href="${link}" target="_blank" style="color:#93c5fd;text-decoration:none;font-weight:800;">${_esc(i.client_id)}</a>
                                    ${i.trader ? `<span style="color:#64748b;font-size:0.75rem;">· ${_esc(i.trader)}</span>` : ''}
                                    <span style="color:#94a3b8;font-size:0.72rem;font-family:'IBM Plex Mono',monospace;">${_esc(type)}</span>
                                </div>
                                <div style="color:#cbd5e1;font-size:0.82rem;margin-top:4px;line-height:1.35;">${_esc(i.detail)}</div>
                            </div>
                            <a href="${link}" target="_blank" title="Go" style="flex:0 0 auto;color:#60a5fa;text-decoration:none;padding:6px 8px;border-radius:8px;border:1px solid rgba(96,165,250,0.25);background:rgba(96,165,250,0.08);"><i class="fas fa-arrow-right"></i></a>
                        </div>
                    `;
                }).join('');
            }

            // Render summary sign-off list (only clients where trader has submitted today)
            const ss = data.summary_signoff || {};
            const req = ss.required_total || 0;
            const signed = ss.signed_total || 0;
            document.getElementById('admin-signoff-badge').textContent = `${signed}/${req} signed`;
            const pending = ss.pending_total || 0;
            const sumBadge = document.getElementById('summaries-nav-badge');
            if (sumBadge) {
                if (pending > 0) { sumBadge.textContent = pending; sumBadge.style.display = 'inline-block'; }
                else { sumBadge.style.display = 'none'; }
            }
            const signedSet = new Set(ss.signed_clients || []);
            const reqSet = new Set([...(ss.pending_clients || []), ...(ss.signed_clients || [])]);
            const sentMeta = ss.trader_sent || {};

            const byClientTrader = new Map((data.clients || []).map(c => [c.client_id, c.trader || '']));
            const reqClients = Array.from(reqSet).sort((a, b) => a.localeCompare(b));

            if (reqClients.length === 0) {
                signoffList.innerHTML = `<div style="text-align:center;color:#94a3b8;padding:18px 10px;">No trader summaries submitted yet today.</div>`;
            } else {
                signoffList.innerHTML = reqClients.map(cid => {
                    const isDone = signedSet.has(cid);
                    const trader = byClientTrader.get(cid) || '';
                    const meta = sentMeta[cid] || {};
                    const sentBy = meta.user_identifier ? String(meta.user_identifier) : '';
                    const sentAt = meta.submitted_at ? String(meta.submitted_at) : '';
                    const sentShort = sentAt && sentAt.includes('T') ? sentAt.split('T')[1].slice(0,5) : '';
                    return `
                        <div style="display:flex;align-items:center;gap:10px;padding:10px 10px;border:1px solid rgba(22,32,64,0.9);border-radius:10px;background:rgba(2,6,23,0.55);margin-bottom:8px;">
                            <input type="checkbox"
                                data-cid="${_esc(cid)}"
                                ${isDone ? 'checked disabled' : ''}
                                onchange="toggleAdminSignoff(this.dataset.cid, this.checked)"
                                style="width:16px;height:16px;accent-color:#4ade80;cursor:${isDone ? 'default' : 'pointer'};">
                            <div style="min-width:0;flex:1 1 auto;">
                                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                                    <span style="color:#e8eeff;font-weight:800;">${_esc(cid)}</span>
                                    ${trader ? `<span style="color:#64748b;font-size:0.75rem;">· ${_esc(trader)}</span>` : ''}
                                </div>
                                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;">
                                    <span style="color:#60a5fa;font-size:0.74rem;font-family:'IBM Plex Mono',monospace;">
                                        Sent ✅${sentShort ? ' ' + sentShort : ''}${sentBy ? ' by ' + _esc(sentBy) : ''}
                                    </span>
                                    <span style="color:${isDone ? '#4ade80' : '#fbbf24'};font-size:0.74rem;font-family:'IBM Plex Mono',monospace;">
                                        ${isDone ? 'Acknowledged + approved (sent to client)' : 'Awaiting your acknowledgement'}
                                    </span>
                                </div>
                            </div>
                            <a href="/dashboard/${encodeURIComponent(cid)}" target="_blank" title="Open client" style="flex:0 0 auto;color:#60a5fa;text-decoration:none;padding:6px 8px;border-radius:8px;border:1px solid rgba(96,165,250,0.25);background:rgba(96,165,250,0.08);"><i class="fas fa-arrow-right"></i></a>
                        </div>
                    `;
                }).join('');
            }
        } catch (e) {
            issuesList.innerHTML = `<div style="color:#f87171;padding:12px;">Error: ${_esc(e.message || e)}</div>`;
            signoffList.innerHTML = `<div style="color:#f87171;padding:12px;">Error: ${_esc(e.message || e)}</div>`;
        }
    }

    function openAdminTab(tab) {
        const issuesBtn = document.getElementById('admin-issues-tab-btn');
        const sumsBtn = document.getElementById('admin-summaries-tab-btn');
        const issuesPanel = document.getElementById('admin-issues-panel');
        const sumsPanel = document.getElementById('admin-summaries-panel');
        const showIssues = (tab || 'issues') === 'issues';
        if (issuesPanel) issuesPanel.style.display = showIssues ? 'block' : 'none';
        if (sumsPanel) sumsPanel.style.display = showIssues ? 'none' : 'block';
        if (issuesBtn) {
            issuesBtn.style.color = showIssues ? '#93c5fd' : '#7898be';
            issuesBtn.style.borderBottom = showIssues ? '2px solid #93c5fd' : '2px solid transparent';
        }
        if (sumsBtn) {
            sumsBtn.style.color = showIssues ? '#7898be' : '#93c5fd';
            sumsBtn.style.borderBottom = showIssues ? '2px solid transparent' : '2px solid #93c5fd';
        }
    }

    function closeAdminPanels() {
        const issuesPanel = document.getElementById('admin-issues-panel');
        const sumsPanel = document.getElementById('admin-summaries-panel');
        if (issuesPanel) issuesPanel.style.display = 'none';
        if (sumsPanel) sumsPanel.style.display = 'none';
        const issuesBtn = document.getElementById('admin-issues-tab-btn');
        const sumsBtn = document.getElementById('admin-summaries-tab-btn');
        if (issuesBtn) { issuesBtn.style.color = '#7898be'; issuesBtn.style.borderBottom = '2px solid transparent'; }
        if (sumsBtn) { sumsBtn.style.color = '#7898be'; sumsBtn.style.borderBottom = '2px solid transparent'; }
    }

    async function toggleAdminSignoff(clientId, checked) {
        const cid = String(clientId || '').trim();
        if (!cid) return;
        if (!_adminTracker || !_adminTracker.summary_signoff) return;
        // Once signed, it becomes read-only (no toggling off).
        const alreadySigned = new Set((_adminTracker.summary_signoff.signed_clients || [])).has(cid);
        if (alreadySigned) return;
        try {
            const resp = await fetch('/api/admin/summary_signoff', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    admin: adminName,
                    client_id: cid,
                    checked: true,
                    date: _adminTracker.date || ''
                })
            });
            const data = await resp.json();
            if (!resp.ok || data.status !== 'success') {
                alert(data.message || 'Failed to save sign-off');
            }
        } catch (e) {
            alert('Failed to save sign-off: ' + (e.message || e));
        } finally {
            // refresh counts + pending list
            loadAdminTracker();
        }
    }

    // Load tracker on page load
    loadAdminTracker();

    function editClient(admin, trader, name, category, activeStatus) {
        document.getElementById('editAdmin').value = admin;
        document.getElementById('editTrader').value = trader;
        document.getElementById('editName').value = name;
        document.getElementById('editNameDisplay').textContent = name;
        document.getElementById('editCategory').value = (category && category.toUpperCase() === 'BEF') ? 'BEF' : 'PRIVATE';
        document.getElementById('editActiveStatus').value = activeStatus || 'active';
        document.getElementById('editClientModal').style.display = 'block';
    }

    function closeEditModal() {
        document.getElementById('editClientModal').style.display = 'none';
    }

    window.onclick = function(e) {
        if (e.target === document.getElementById('editClientModal')) closeEditModal();
    };

    document.getElementById('editClientForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.querySelector('.btn-gold');
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Saving...';

        fetch('/api/update_client_profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                admin:         document.getElementById('editAdmin').value,
                trader:        document.getElementById('editTrader').value,
                name:          document.getElementById('editName').value,
                category:      document.getElementById('editCategory').value,
                active_status: document.getElementById('editActiveStatus').value
            })
        })
        .then(res => res.json())
        .then(result => {
            if (result.status === 'success') {
                location.reload();
            } else {
                alert('Error: ' + result.message);
                btn.innerHTML = original;
            }
        })
        .catch(() => {
            alert('Connection error');
            btn.innerHTML = original;
        });
    };
    // Default tab on load (issues)
    openAdminTab('issues');
</script>
</body>
</html>
