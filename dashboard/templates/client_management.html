<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Management - Super Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* --- Dark Theme Overrides (TradeOpss) --- */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #fbbf24;
            --border-color: rgba(255,255,255,0.1);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        a { color: var(--accent-color); text-decoration: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
        th { background-color: rgba(15, 23, 42, 0.8); color: var(--text-secondary); text-transform: uppercase; font-size: 0.85rem; }
        
        .btn { padding: 10px 20px; background-color: var(--accent-color); color: #000; border: none; cursor: pointer; border-radius: 6px; font-weight: 600; }
        .btn:hover { filter: brightness(1.1); }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 30px; width: 50%; max-width: 500px; border-radius: 12px; border: 1px solid var(--border-color); color: var(--text-primary); }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-secondary); }
        input, select { 
            width: 100%; padding: 12px; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid var(--border-color); 
            color: white; 
            border-radius: 6px; 
        }
        input:focus, select:focus {
            outline: none; border-color: var(--accent-color);
        }

        .close { float: right; cursor: pointer; font-size: 24px; color: var(--text-secondary); }
        .close:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Client Management</h1>
            <div>
                <a href="/super_admin" style="margin-right: 15px;">Back to Dashboard</a>
                <button class="btn" onclick="openModal()">Add New Client</button>
            </div>
        </header>

        <table id="clientsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    {% if not is_bef_admin %}
                    <th>Category</th>
                    {% endif %}
                    <th>Admin</th>
                    <th>Trader</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Clients will be loaded here -->
            </tbody>
        </table>
    </div>

    <!-- Add Client Modal -->
    <div id="addClientModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Add New Client</h2>
            <form id="addClientForm">
                <div class="form-group">
                    <label>Admin</label>
                    <select id="adminSelect" onchange="loadTraders()" required></select>
                </div>
                <div class="form-group">
                    <label>Trader</label>
                    <select id="traderSelect" required></select>
                </div>
                <div class="form-group">
                    <label>Client Name</label>
                    <input type="text" id="clientName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="clientEmail">
                </div>
                {% if not is_bef_admin %}
                <div class="form-group">
                    <label>Category</label>
                    <select id="clientCategory">
                        <option value="">None</option>
                        <option value="BEF">BEF</option>
                        <option value="Private">Private</option>
                    </select>
                </div>
                {% else %}
                <input type="hidden" id="clientCategory" value="BEF">
                {% endif %}
                <button type="submit" class="btn">Add Client</button>
            </form>
        </div>
    </div>

    <!-- Edit Client Modal -->
    <div id="editClientModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2>Edit Client Profile</h2>
            <form id="editClientForm">
                <input type="hidden" id="editAdmin">
                <input type="hidden" id="editTrader">
                <input type="hidden" id="editName">
                
                <div class="form-group">
                    <label>Client Name: <span id="editNameDisplay" style="font-weight:bold;"></span></label>
                </div>
                
                {% if not is_bef_admin %}
                <div class="form-group">
                    <label>Category (Profile)</label>
                    <select id="editCategory">
                        <option value="BEF">BEF</option>
                        <option value="PRIVATE">Private</option>
                    </select>
                </div>
                {% else %}
                <input type="hidden" id="editCategory" value="BEF">
                {% endif %}

                <div class="form-group">
                    <label>Status</label>
                    <select id="editActiveStatus">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <button type="submit" class="btn">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        const IS_BEF_ADMIN = "{{ 'true' if is_bef_admin else 'false' }}" === "true";

        // Load Clients
        fetch('/api/hierarchy')
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector('#clientsTable tbody');
                const adminSelect = document.getElementById('adminSelect');
                
                // Populate Admin Select
                Object.keys(data.admins).forEach(admin => {
                    const option = document.createElement('option');
                    option.value = admin;
                    option.textContent = admin;
                    adminSelect.appendChild(option);
                });
                loadTraders(); // Initial load

                // Populate Table
                Object.entries(data.admins).forEach(([adminName, adminData]) => {
                    Object.entries(adminData.traders).forEach(([traderName, traderData]) => {
                        // Handle both array (legacy) and object structure for clients
                        let clients = traderData.clients || [];
                        if (Array.isArray(traderData)) clients = traderData;

                        clients.forEach(client => {
                            const row = tbody.insertRow();
                            const profile = client.category || client.profile || 'PRIVATE';
                            const activeStatus = client.active_status || 'active';
                            
                            let categoryCell = `<td>${profile}</td>`;
                            if (IS_BEF_ADMIN) {
                                categoryCell = ''; // Don't render category cell for BEF admin
                            }

                            const inactiveBadge = activeStatus === 'inactive'
                                ? ' <span style="background:#ef4444;color:#fff;padding:1px 6px;border-radius:4px;font-size:0.7rem;font-weight:600;">INACTIVE</span>'
                                : '';

                            row.innerHTML = `
                                <td>${client.name}${inactiveBadge}</td>
                                <td>${client.email || ''}</td>
                                ${categoryCell}
                                <td>${adminName}</td>
                                <td>${traderName}</td>
                                <td>
                                    <button class="btn" style="margin-right: 5px;" onclick="editClient('${adminName}', '${traderName}', '${client.name}', '${profile}', '${activeStatus}')">Edit</button>
                                    <button class="btn" style="background-color: #dc3545; padding: 4px 8px; font-size: 0.8rem;" onclick="removeClient('${adminName}', '${traderName}', '${client.name}')">Remove</button>
                                </td>
                            `;
                        });
                    });
                });
            });

        function removeClient(admin, trader, name) {
            if (confirm(`Are you sure you want to remove Client "${name}"?`)) {
                fetch('/api/remove_client', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({admin: admin, trader: trader, name: name})
                })
                .then(res => res.json())
                .then(result => {
                    if (result.status === 'success') {
                        location.reload();
                    } else {
                        alert('Error: ' + result.message);
                    }
                });
            }
        }

        function loadTraders() {
            const adminName = document.getElementById('adminSelect').value;
            const traderSelect = document.getElementById('traderSelect');
            traderSelect.innerHTML = '';
            
            fetch('/api/hierarchy')
                .then(res => res.json())
                .then(data => {
                    if (data.admins[adminName]) {
                        Object.keys(data.admins[adminName].traders).forEach(trader => {
                            const option = document.createElement('option');
                            option.value = trader;
                            option.textContent = trader;
                            traderSelect.appendChild(option);
                        });
                    }
                });
        }

        // Modal Functions
        function openModal() { document.getElementById('addClientModal').style.display = 'block'; }
        function closeModal() { document.getElementById('addClientModal').style.display = 'none'; }
        function openEditModal(clientName, admin, trader, category) {
            document.getElementById('editNameDisplay').textContent = clientName;
            document.getElementById('editAdmin').value = admin;
            document.getElementById('editTrader').value = trader;
            document.getElementById('editName').value = clientName;
            document.getElementById('editCategory').value = category;
            document.getElementById('editClientModal').style.display = 'block';
        }
        function closeEditModal() { document.getElementById('editClientModal').style.display = 'none'; }
        window.onclick = function(event) {
            if (event.target == document.getElementById('addClientModal')) {
                closeModal();
            } else if (event.target == document.getElementById('editClientModal')) {
                closeEditModal();
            }
        }

        // Form Submit
        document.getElementById('addClientForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                admin: document.getElementById('adminSelect').value,
                trader: document.getElementById('traderSelect').value,
                name: document.getElementById('clientName').value,
                email: document.getElementById('clientEmail').value,
                category: document.getElementById('clientCategory').value
            };

            fetch('/api/add_client', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    alert('Client added successfully');
                    location.reload();
                } else {
                    alert('Error: ' + result.message);
                }
            });
        };

        // Edit Modal Functions
        function editClient(admin, trader, name, category, activeStatus) {
            document.getElementById('editAdmin').value = admin;
            document.getElementById('editTrader').value = trader;
            document.getElementById('editName').value = name;
            document.getElementById('editNameDisplay').textContent = name;
            
            // Normalize category just in case
            let val = 'PRIVATE';
            if (category && category.toUpperCase() === 'BEF') val = 'BEF';
            document.getElementById('editCategory').value = val;
            document.getElementById('editActiveStatus').value = activeStatus || 'active';
            
            document.getElementById('editClientModal').style.display = 'block';
        }

        document.getElementById('editClientForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                admin: document.getElementById('editAdmin').value,
                trader: document.getElementById('editTrader').value,
                name: document.getElementById('editName').value,
                category: document.getElementById('editCategory').value,
                active_status: document.getElementById('editActiveStatus').value
            };

            fetch('/api/update_client_profile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    alert('Client profile updated successfully');
                    location.reload();
                } else {
                    alert('Error: ' + result.message);
                }
            });
        };
    </script>
</body>
</html>
