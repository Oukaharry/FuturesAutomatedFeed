<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TradeOpss</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #060d1a;
            color: #f8fafc;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* Full-screen blurry logo background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url("{{ url_for('static', filename='images/logo_original.png') }}") center/cover no-repeat;
            filter: blur(18px) brightness(0.18);
            transform: scale(1.05); /* prevent blur edge bleed */
            z-index: 0;
        }

        body > * { position: relative; z-index: 1; }

        /* ── LEFT PANEL ── */
        .left-panel {
            width: 100%;
            max-width: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 0;
            overflow: visible;
            background: transparent;
        }

        /* Animated grid lines */
        .left-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(251,191,36,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(251,191,36,0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            from { transform: translateY(0); }
            to   { transform: translateY(50px); }
        }

        /* Glow orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(251,191,36,0.12) 0%, transparent 70%);
            top: -100px; left: -100px;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, transparent 70%);
            bottom: -50px; right: -50px;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(251,191,36,0.08) 0%, transparent 70%);
            bottom: 30%; left: 10%;
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.2); }
        }

        .left-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0;
            max-width: 900px;
        }

        .logo-img {
            width: 540px;
            height: 540px;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(251,191,36,0.3));
            animation: floatLogo 6s ease-in-out infinite;
            display: block;
            margin-bottom: -100px;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-12px); }
        }

        .brand-name {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 40%, #fcd34d 80%, #fbbf24 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            from { background-position: 0% center; }
            to   { background-position: 200% center; }
        }

        .brand-tagline {
            font-size: 1.05rem;
            color: #94a3b8;
            font-weight: 400;
            line-height: 1.6;
            max-width: 340px;
        }

        .stats-row {
            display: flex;
            gap: 32px;
            margin-top: 8px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fbbf24;
        }
        .stat-label {
            font-size: 0.72rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 500;
        }

        /* Candlestick chart decoration */
        .chart-decoration {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 60px;
            margin-top: 8px;
        }
        .candle {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: candleGrow 2s ease-out forwards;
            opacity: 0;
        }
        .candle:nth-child(1) { animation-delay: 0.1s; }
        .candle:nth-child(2) { animation-delay: 0.2s; }
        .candle:nth-child(3) { animation-delay: 0.3s; }
        .candle:nth-child(4) { animation-delay: 0.4s; }
        .candle:nth-child(5) { animation-delay: 0.5s; }
        .candle:nth-child(6) { animation-delay: 0.6s; }
        .candle:nth-child(7) { animation-delay: 0.7s; }
        .candle:nth-child(8) { animation-delay: 0.8s; }
        @keyframes candleGrow {
            from { opacity: 0; transform: scaleY(0); transform-origin: bottom; }
            to   { opacity: 1; transform: scaleY(1); transform-origin: bottom; }
        }
        .candle-wick { width: 2px; background: currentColor; }
        .candle-body { width: 10px; border-radius: 2px; }
        .candle.green { color: #22c55e; }
        .candle.red   { color: #ef4444; }

        /* ── RIGHT PANEL ── */
        .right-panel {
            width: 100%;
            max-width: 480px;
            background: #0d1425;
            border: 1px solid rgba(251,191,36,0.12);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 48px;
            position: relative;
            margin-top: 0;
        }

        .right-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fcd34d, #fbbf24);
            background-size: 200% auto;
            animation: shimmer 2s linear infinite;
        }

        .form-header {
            margin-bottom: 40px;
        }
        .form-header h2 {
            font-size: 1.9rem;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .form-header p {
            color: #64748b;
            font-size: 0.95rem;
        }
        .form-header p span {
            color: #fbbf24;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 10px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            display: flex;
            align-items: center;
            transition: color 0.3s;
            pointer-events: none;
        }
        .form-group input {
            width: 100%;
            padding: 15px 16px 15px 46px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            font-size: 0.95rem;
            color: #f1f5f9;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .form-group input::placeholder { color: #334155; }
        .form-group input:focus {
            outline: none;
            border-color: rgba(251,191,36,0.5);
            background: rgba(251,191,36,0.04);
            box-shadow: 0 0 0 3px rgba(251,191,36,0.08);
        }
        .form-group input:focus ~ .icon,
        .input-wrapper:focus-within .icon { color: #fbbf24; }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #475569;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .password-toggle:hover { color: #fbbf24; }

        .form-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .remember-me input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #fbbf24;
        }
        .remember-me label {
            font-size: 0.85rem;
            color: #64748b;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #0d1425;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        .login-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .login-btn:hover::after { opacity: 1; }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(251,191,36,0.35);
        }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(13,20,37,0.3);
            border-top-color: #0d1425;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            padding: 13px 16px;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 0.88rem;
            display: none;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }
        .message.error  { background: rgba(239,68,68,0.1);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
        .message.success{ background: rgba(34,197,94,0.1);  color: #86efac; border: 1px solid rgba(34,197,94,0.2); }
        .message.show   { display: flex; }

        .secure-note {
            margin-top: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: #334155;
            font-size: 0.78rem;
        }
        .secure-note svg { color: #475569; }

        .orb, .brand-name, .brand-tagline, .chart-decoration, .stats-row { display: none; }

        /* Responsive */
        @media (max-width: 820px) {
            .right-panel { padding: 40px 28px; }
        }
        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            .logo-img {
                width: 240px !important;
                height: 240px !important;
                margin-bottom: -60px !important;
            }
            .right-panel {
                padding: 32px 20px;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ── LOGO ── -->
    <img src="{{ url_for('static', filename='images/logo_original.png') }}" alt="TradeOpss" class="logo-img">

    <!-- ── RIGHT PANEL ── -->
    <div class="right-panel">
        <div class="form-header">
            <h2>Welcome Back</h2>
            <p>Sign in to your <span>TradeOpss</span> account</p>
        </div>

        <div id="message" class="message"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
                    <input type="text" id="identifier" placeholder="you@example.com" required autocomplete="username" oninput="checkIfSuperAdmin()">
                </div>
            </div>

            <div class="form-group" id="password-group" style="display:none;">
                <label>Password</label>
                <div class="input-wrapper">
                    <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                    <span class="password-toggle" onclick="togglePassword()"><svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                </div>
            </div>

            <div class="form-footer-row">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Keep me signed in</label>
                </div>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                <span class="spinner" id="spinner"></span>
                <span id="btn-text">Sign In</span>
            </button>
        </form>

    </div>

    <script>
        const SVG_EYE = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const SVG_EYE_OFF = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10 10 0 0 1 12 20C5 20 1 12 1 12a18 18 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
        const SVG_CHECK = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        const SVG_X = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

        let isSuperAdmin = false;

        async function checkIfSuperAdmin() {
            const identifier = document.getElementById('identifier').value.trim();
            const passwordGroup = document.getElementById('password-group');
            const passwordInput = document.getElementById('password');
            if (!identifier) {
                passwordGroup.style.display = 'none';
                passwordInput.required = false;
                isSuperAdmin = false;
                return;
            }
            try {
                const res = await fetch('/api/auth/check-admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({identifier})
                });
                const data = await res.json();
                isSuperAdmin = data.requires_password || false;
            } catch(e) {
                isSuperAdmin = false;
            }
            if (isSuperAdmin) {
                passwordGroup.style.display = 'block';
                passwordInput.required = true;
            } else {
                passwordGroup.style.display = 'none';
                passwordInput.required = false;
                passwordInput.value = '';
            }
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const toggle = document.querySelector('.password-toggle');
            if (input.type === 'password') {
                input.type = 'text';
                toggle.innerHTML = SVG_EYE_OFF;
            } else {
                input.type = 'password';
                toggle.innerHTML = SVG_EYE;
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.innerHTML = `<span>${type === 'error' ? SVG_X : SVG_CHECK}</span><span>${text}</span>`;
            msg.className = `message ${type} show`;
        }
        
        function hideMessage() {
            document.getElementById('message').classList.remove('show');
        }
        
        function setLoading(loading) {
            const btn = document.getElementById('login-btn');
            const spinner = document.getElementById('spinner');
            const text = document.getElementById('btn-text');
            
            btn.disabled = loading;
            spinner.style.display = loading ? 'block' : 'none';
            text.textContent = loading ? 'Signing in...' : 'Sign In';
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            hideMessage();
            
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            if (!identifier) {
                showMessage('Please enter your email', 'error');
                return;
            }
            
            // Only require password for super admin
            if (isSuperAdmin && !password) {
                showMessage('Password is required', 'error');
                return;
            }
            
            setLoading(true);
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: identifier,
                        password: password || '',
                        remember: remember
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    showMessage(`Welcome back! Redirecting...`, 'success');
                    
                    setTimeout(() => {
                        if (data.must_change_password) {
                            window.location.href = '/change-password';
                        } else {
                            window.location.href = data.redirect || '/';
                        }
                    }, 1000);
                } else {
                    showMessage(data.message || 'Login failed', 'error');
                    setLoading(false);
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Connection error. Please try again.', 'error');
                setLoading(false);
            }
        }
        
        document.getElementById('identifier').focus();
    </script>
</body>
</html>
