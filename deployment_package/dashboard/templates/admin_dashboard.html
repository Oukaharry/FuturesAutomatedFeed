<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MT5 Hedging Engine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; align-items: center;">
                <h1>{{ admin_name }}</h1>
                <span class="role-badge">Admin</span>
            </div>
            <a href="/logout" class="logout-btn">Logout</a>
        </header>

        <div id="content">
            <!-- Traders will be injected here -->
        </div>
    </div>

    <!-- Edit Client Modal for Admins -->
    <div id="editClientModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
        <div style="background:white; margin:15% auto; padding:20px; width:400px; border-radius:8px; position:relative;">
            <span onclick="closeEditModal()" style="position:absolute; right:15px; top:10px; font-size:24px; cursor:pointer;">&times;</span>
            <h2 style="margin-top:0;">Edit Client Profile</h2>
            <form id="editClientForm">
                <input type="hidden" id="editAdmin">
                <input type="hidden" id="editTrader">
                <input type="hidden" id="editName">
                
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:600;">Client: <span id="editNameDisplay" style="font-weight:normal;"></span></label>
                </div>
                
                <div style="margin-bottom:20px;">
                    <label style="display:block; margin-bottom:5px; font-weight:600;">Category (Profile)</label>
                    <select id="editCategory" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                        <option value="BEF">BEF</option>
                        <option value="PRIVATE">Private</option>
                    </select>
                </div>
                <button type="submit" style="background:#0f172a; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; width:100%;">Save Changes</button>
            </form>
        </div>
    </div>
    
    <script>
        const adminName = "{{ admin_name }}";
        
        // Modal functions
        function editClient(admin, trader, name, category) {
            document.getElementById('editAdmin').value = admin;
            document.getElementById('editTrader').value = trader;
            document.getElementById('editName').value = name;
            document.getElementById('editNameDisplay').textContent = name;
            
            let val = 'PRIVATE';
            if (category && category.toUpperCase() === 'BEF') val = 'BEF';
            document.getElementById('editCategory').value = val;
            
            document.getElementById('editClientModal').style.display = 'block';
        }
        
        function closeEditModal() {
            document.getElementById('editClientModal').style.display = 'none';
        }

        // Close on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('editClientModal');
            if (event.target == modal) {
                closeEditModal();
            }
        }
        
        // Handle form submit
        document.getElementById('editClientForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                admin: document.getElementById('editAdmin').value,
                trader: document.getElementById('editTrader').value,
                name: document.getElementById('editName').value,
                category: document.getElementById('editCategory').value
            };

            fetch('/api/update_client_profile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    alert('Client profile updated successfully');
                    location.reload();
                } else {
                    alert('Error: ' + result.message);
                }
            });
        };

        fetch('/api/hierarchy')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('content');
                const adminData = data.admins[adminName];
                
                if (!adminData) {
                    container.innerHTML = '<div style="text-align:center; padding:40px;">Admin not found.</div>';
                    return;
                }

                const traders = adminData.traders;
                if (Object.keys(traders).length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding:40px; color:#999;">No traders assigned.</div>';
                    return;
                }

                for (const [trader, traderData] of Object.entries(traders)) {
                    // Handle new structure where traderData is an object with a 'clients' array
                    const clientsList = traderData.clients || (Array.isArray(traderData) ? traderData : []);

                    let clientsHtml = clientsList.map(clientObj => {
                        // Support both string client or client object
                        let client = clientObj;
                        let profile = "PRIVATE";
                        if (typeof clientObj === 'object' && clientObj !== null) {
                            client = clientObj.name;
                            profile = clientObj.category || 'PRIVATE';
                        }
                        
                        return `
                        <div class="client-card-wrapper" style="position:relative;">
                             <a href="/dashboard/${client}" class="client-card" style="display:block;">
                                <div class="client-name">${client}</div>
                                <div class="client-status" style="font-size:0.8rem; color:#64748b;">${profile}</div>
                                <div class="client-status">View Dashboard →</div>
                            </a>
                            <button onclick="editClient('${adminName}', '${trader}', '${client}', '${profile}')" class="btn-sm" style="position:absolute; top:10px; right:10px; background:#e2e8f0; border:none; border-radius:4px; padding:2px 6px; cursor:pointer; font-size:0.7rem;">Edit</button>
                        </div>
                    `}).join('');

                    if (!clientsHtml) clientsHtml = '<div style="color:#999; font-size:0.9rem; font-style:italic;">No clients assigned</div>';

                    const card = document.createElement('div');
                    card.className = 'trader-card';
                    card.innerHTML = `
                        <div class="trader-header">
                            ${trader} <span class="trader-badge">Trader</span>
                        </div>
                        <div class="client-grid">
                            ${clientsHtml}
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
    </script>
</body>
</html>
